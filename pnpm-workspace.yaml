packages:
  - 'packages/*'
  - 'packages/typing-game/*'
  - 'examples/*'
  - 'comparisons/*'
  - 'internal/*'

allowBuilds:
  '@parcel/watcher': true
  dprint: true
  msgpackr-extract: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@effect/platform-browser@4.1.0'
  - '@effect/platform-node-shared@4.1.0'
  - '@effect/platform-node@4.1.0'
  - '@effect/vitest@4.1.0'
  - effect@4.1.0
  - '@effect/tsgo-darwin-arm64@0.50.0'
  - '@effect/tsgo-darwin-x64@0.50.0'
  - '@effect/tsgo-linux-arm64@0.50.0'
  - '@effect/tsgo-linux-arm@0.50.0'
  - '@effect/tsgo-linux-x64@0.50.0'
  - '@effect/tsgo-win32-arm64@0.50.0'
  - '@effect/tsgo-win32-x64@0.50.0'
  - '@effect/tsgo@0.50.0'
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261031.1'
  - typescript@7.1.0-dev.20261031.1

overrides:
  '@mapbox/jsonlint-lines-primitives': 2.0.2
  '@types/node': 26.4.0
  effect: 4.1.0
  '@effect/platform-browser': 4.1.0
  '@effect/platform-node': 4.1.0
  '@effect/platform-node-shared': 4.1.0
  '@effect/vitest': 4.1.0
  'monaco-editor>dompurify': 3.4.14

patchedDependencies:
  effect-oxlint@0.3.4: patches/effect-oxlint@0.3.4.patch
  filing-cabinet@5.5.1: patches/filing-cabinet@5.5.1.patch
  knip@6.38.0: patches/knip@6.38.0.patch
  precinct@12.3.2: patches/precinct@12.3.2.patch
  vite@8.3.1: patches/vite@8.3.1.patch
